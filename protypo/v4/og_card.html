<!doctype html>
<!-- Η κάρτα που φαίνεται όταν στέλνεται ο σύνδεσμος σε WhatsApp/Viber/email.
     Ίδιο ύφος με την αρχή του site (v4.css: .hero, .hero-mesh, .tag, .creds).
     ΟΛΑ στο κεντρικό τετράγωνο 630×630: το WhatsApp στο κινητό κόβει αριστερά-δεξιά
     (ως και σε τετράγωνο)· οι άκρες έχουν μόνο χρώμα.
     Δεν ανεβαίνει· τη φωτογραφίζει το build_og_v4.py σε 1200×630. -->
<html lang="el">
<head>
<meta charset="utf-8" />
<link href="../../assets/fonts/fonts.css" rel="stylesheet" />
<style>
  :root {
    --paper: #f4f1ec;
    --ink: #121414;
    --muted: #5d6462;
    --petrol-deep: #0a4c49;
    --teal: #0fa39a;
    --coral: #ff6b4a;
    --violet: #7c5cff;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  body { position: relative; color: var(--ink); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  .mesh {
    position: absolute; inset: 0; overflow: hidden; background: #ffe3b3;
    clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%);
  }
  .hb { position: absolute; border-radius: 50%; filter: blur(70px); }
  /* ανοιχτά στη μέση πίσω από το κείμενο, έντονα στις άκρες */
  .hb1 { width: 620px; height: 620px; left: 290px; top: -200px; background: #ffd27a; }
  .hb2 { width: 520px; height: 520px; left: 340px; top: 260px; background: #9fe0f7; }
  .hb6 { width: 380px; height: 380px; left: 200px; top: 120px; background: #ffb5a0; }
  .hb3 { width: 520px; height: 520px; right: -260px; top: -220px; background: var(--violet); }
  .hb4 { width: 420px; height: 420px; right: -120px; top: 200px; background: var(--coral); }
  .hb5 { width: 460px; height: 460px; left: -240px; top: 220px; background: var(--teal); }
  .hb8 { width: 480px; height: 480px; left: -220px; top: -220px; background: #b9a6ff; }

  .copy {
    position: absolute; left: 0; right: 0; top: 34px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .photo {
    width: 168px; height: 168px; border-radius: 50%;
    border: 7px solid #fff; box-shadow: 0 20px 50px rgba(18, 20, 20, 0.2);
    background: url("__AVATAR__") center 30% / cover no-repeat;
  }
  .tag {
    display: inline-flex; align-items: baseline; gap: 8px; margin-top: 20px;
    padding: 10px 22px; border-radius: 999px; background: #fff;
    box-shadow: 0 6px 20px rgba(18, 20, 20, 0.08);
    font-family: Manrope, sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em;
  }
  .tag small { font-family: Inter, sans-serif; font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  h1 {
    margin: 20px 0 0; font-family: Manrope, Inter, sans-serif; font-weight: 800;
    font-size: 70px; line-height: 1; letter-spacing: -0.035em;
  }
  .paint { position: relative; display: inline-block; z-index: 0; }
  .paint svg { position: absolute; left: -4%; bottom: 0.02em; width: 108%; height: 0.42em; z-index: -1; overflow: visible; }
  .creds { display: flex; gap: 30px; margin-top: 26px; font-size: 15px; color: var(--muted); }
  .creds b { display: block; color: var(--ink); font-family: Manrope, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
</style>
</head>
<body>
  <div class="mesh"><span class="hb hb1"></span><span class="hb hb2"></span><span class="hb hb6"></span><span class="hb hb3"></span><span class="hb hb4"></span><span class="hb hb5"></span><span class="hb hb8"></span></div>
  <div class="copy">
    <div class="photo"></div>
    <div class="tag">Γιάννης Βαρδαβάς<small>lutcf</small></div>
    <h1>Τα χρήματά σου,<br />με <span class="paint">σχέδιο.<svg viewBox="0 0 400 40" preserveAspectRatio="none"><path d="M6 26 C 90 8, 210 6, 394 20" stroke="#fff" stroke-width="22" stroke-linecap="round" fill="none"/></svg></span></h1>
    <div class="creds">
      <div><b>25+ χρόνια</b>ασφαλίσεις &amp; επενδύσεις</div>
      <div><b>LUTCF</b>διεθνής πιστοποίηση</div>
      <div><b>177766</b>Μητρώο ΕΕΑ</div>
    </div>
  </div>
</body>
</html>
