<!doctype html>
<!-- Η κάρτα που φαίνεται όταν στέλνεται ο σύνδεσμος σε WhatsApp/Viber/email.
     7/11/2026: μάρκα — σλόγκαν «Ο φόβος φεύγει όταν το χειρότερο έχει νούμερο.»,
     σήμα Β, σκούρα λωρίδα (#1d1b4f) όπως στο site (v4.css: .slogan-band).
     Δύο εκδοχές με την κλάση του body: "a" = φωτεινό φόντο + σκούρα λωρίδα, "b" = όλη σκούρα.
     ΟΛΑ στο κεντρικό τετράγωνο 630×630 (x 285–915): το WhatsApp στο κινητό κόβει
     αριστερά-δεξιά· οι άκρες έχουν μόνο χρώμα.
     Δεν ανεβαίνει· τη φωτογραφίζει το build_og_v4.py σε 1200×630. -->
<html lang="el">
<head>
<meta charset="utf-8" />
<link href="../../assets/fonts/fonts.css" rel="stylesheet" />
<style>
  :root {
    --paper: #f4f1ec;
    --ink: #121414;
    --muted: #5d6462;
    --night: #1d1b4f;
    --teal: #0fa39a;
    --coral: #ff6b4a;
    --violet: #7c5cff;
    --gold: #f2b544;
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--paper); }
  body { position: relative; color: var(--ink); font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; }
  .mesh { position: absolute; inset: 0; overflow: hidden; }
  .hb { position: absolute; border-radius: 50%; filter: blur(70px); }

  .copy {
    position: absolute; left: 285px; width: 630px; top: 0; bottom: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  }
  .photo {
    width: 128px; height: 128px; border-radius: 50%; flex: none;
    border: 6px solid #fff; box-shadow: 0 18px 44px rgba(18, 20, 20, 0.22);
    background: url("__AVATAR__") center 30% / cover no-repeat;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 10px; margin-top: 16px;
    padding: 8px 20px 8px 12px; border-radius: 999px; background: #fff;
    box-shadow: 0 6px 20px rgba(18, 20, 20, 0.1);
    font-family: Manrope, sans-serif; font-weight: 800; font-size: 23px; letter-spacing: -0.02em; color: var(--ink);
  }
  .tag svg { width: 30px; height: 30px; flex: none; }
  .tag small { font-family: Inter, sans-serif; font-size: 15px; color: var(--muted); font-weight: 600; letter-spacing: 0; }
  .slogan {
    margin: 0; font-family: Manrope, Inter, sans-serif; font-weight: 800;
    letter-spacing: -0.04em; line-height: 1.04; color: #fff;
  }
  .slogan em {
    font-style: normal;
    background: linear-gradient(90deg, var(--gold), var(--coral));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .creds { display: flex; gap: 28px; font-size: 14px; }
  .creds b { display: block; font-family: Manrope, sans-serif; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }

  /* ───── Α: φωτεινό φόντο όπως η αρχή του site + σκούρα λωρίδα ───── */
  .a .mesh { background: #ffe3b3; }
  .a .hb1 { width: 620px; height: 620px; left: 290px; top: -260px; background: #ffd27a; }
  .a .hb2 { width: 520px; height: 520px; left: 340px; top: 300px; background: #9fe0f7; }
  .a .hb3 { width: 520px; height: 520px; right: -260px; top: -220px; background: var(--violet); }
  .a .hb4 { width: 420px; height: 420px; right: -120px; top: 220px; background: var(--coral); }
  .a .hb5 { width: 460px; height: 460px; left: -240px; top: 220px; background: var(--teal); }
  .a .hb6 { width: 480px; height: 480px; left: -220px; top: -220px; background: #b9a6ff; }
  .a .band {
    margin-top: 22px; width: 600px; box-sizing: border-box;
    display: flex; align-items: center; gap: 22px;
    padding: 26px 30px; border-radius: 28px; background: var(--night);
    box-shadow: 0 24px 50px rgba(29, 27, 79, 0.28); text-align: left;
  }
  .a .band svg { width: 92px; height: 92px; flex: none; }
  .a .slogan { font-size: 42px; }
  .a .creds { margin-top: 20px; color: var(--muted); }
  .a .creds b { color: var(--ink); }

  /* ───── Β: όλη η κάρτα σκούρα (η λωρίδα γίνεται το φόντο) ───── */
  .b, .b html { background: var(--night); }
  .b .mesh { background: var(--night); }
  .b .hb { filter: blur(90px); opacity: 0.55; }
  .b .hb1 { width: 520px; height: 520px; left: -300px; top: -240px; background: var(--violet); }
  .b .hb2 { width: 460px; height: 460px; left: -260px; top: 300px; background: var(--teal); }
  .b .hb3 { width: 520px; height: 520px; right: -300px; top: -260px; background: var(--coral); }
  .b .hb4 { width: 460px; height: 460px; right: -260px; top: 300px; background: var(--gold); }
  .b .hb5, .b .hb6 { display: none; }
  .b .band svg { display: none; }
  .b .slogan { margin-top: 24px; font-size: 56px; }
  .b .creds { margin-top: 26px; color: rgba(255, 255, 255, 0.66); }
  .b .creds b { color: #fff; }
</style>
</head>
<body class="__VARIANT__">
  <div class="mesh"><span class="hb hb1"></span><span class="hb hb2"></span><span class="hb hb3"></span><span class="hb hb4"></span><span class="hb hb5"></span><span class="hb hb6"></span></div>
  <div class="copy">
    <div class="photo"></div>
    <div class="tag">__BMARK_INK__Γιάννης Βαρδαβάς<small>lutcf</small></div>
    <div class="band">
      __BMARK_WHITE__
      <p class="slogan">Ο φόβος φεύγει όταν<br />το χειρότερο<br /><em>έχει νούμερο.</em></p>
    </div>
    <div class="creds">
      <div><b>25+ χρόνια</b>ασφαλίσεις &amp; επενδύσεις</div>
      <div><b>LUTCF</b>διεθνής πιστοποίηση</div>
      <div><b>177766</b>Μητρώο ΕΕΑ</div>
    </div>
  </div>
</body>
</html>
